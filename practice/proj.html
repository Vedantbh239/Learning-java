<!doctype html>
<html>
    <style>
        .cart{
            background-color: rgb(255,216,20);
            border: 0px;
            width: 100px;
            height: 20px;
            border-radius: 20px;
            font-weight:300;
            cursor: pointer;
            transition: opacity 0.8s,box-shadow 0.8s;
          
        }
        .cart:hover{
            box-shadow: 2px 2px 13px black;
            opacity: 0.4;
        }
        .cart:active{
            opacity: 0.1;
        }
        .buy:hover{
            background-color: rgb(255, 200, 117);
            color: white;
            box-shadow: 2px 2px 13px black; 
        }
        .buy{
            margin-left: 20px;
            background-color: rgb(255,164,28);
            border: 0;
            height: 25px;
            width: 100px;
            border-radius: 25px;
            font-weight: 400;
            font-weight: bold;
            cursor: pointer;  
            transition: all 0.7s;  
       }
        .stock{color: rgb(0,118,0);}
        .stock:hover{
            color: orange;
        }
        .save{
            margin-left: 20px;
            width: 55px;
            background-color: white;
            border-color: blue;
            color: blue;
        }
        .save:hover{
            background-color: lightblue;
            border-color: lightblue;
            box-shadow: 0 0 0;
        }
    </style>
<head>
    <a href="https://www.aboutamazon.in/">Back to Amazon</a>
</head>
<p class="stock">$39 - in stock</p>
<p>Free delivery tomorrow.</p>
<a href="https://www.aboutamazon.in/" target="_blank">
<button class="cart">Add to cart</button></a>
<button class="buy">Buy now</button>
<button class="save">Save</button>
<html>
    </doctype>
